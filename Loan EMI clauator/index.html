<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏎️ TURBO RUSH</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #050510;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  touch-action: none;
}
#wrapper {
  position: relative;
  display: flex; flex-direction: column;
  align-items: center;
  width: 100%; height: 100%;
}
canvas {
  display: block;
  touch-action: none;
  image-rendering: crisp-edges;
}
#mobileCtrl {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 12px 20px;
  flex-direction: row;
  justify-content: space-between;
  align-items: flex-end;
  pointer-events: none;
  z-index: 50;
  background: linear-gradient(transparent, rgba(0,0,0,0.5));
}
.dpad { display: flex; gap: 10px; pointer-events: all; }
.btn {
  width: 68px; height: 68px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.08s, transform 0.08s;
  pointer-events: all;
}
.btn:active { background: rgba(255,255,255,0.3); transform: scale(0.93); }
#nitroBtn {
  width: 80px; height: 80px;
  background: rgba(255,80,0,0.3);
  border: 2.5px solid #ff5000;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #fff;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  line-height: 1.2;
  pointer-events: all;
}
#nitroBtn .icon { font-size: 20px; }
@media (max-width: 680px), (pointer: coarse) {
  #mobileCtrl { display: flex; }
}
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="mobileCtrl">
    <div class="dpad">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
    <div id="nitroBtn"><span class="icon">🔥</span><span>NITRO</span></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  TURBO RUSH  —  Ultimate Car Racing Game
//  Features: 3 lanes · Nitro · Shield · Coins · Power-ups ×6
//            Particles · Explosions · Night city · Combos
//            Mobile touch · High score · Difficulty curve
// ════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// —— Responsive sizing ——
const CW = 400, CH = 710;   // logical canvas size
canvas.width = CW; canvas.height = CH;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / CW, vh / CH);
  canvas.style.width  = (CW * scale) + 'px';
  canvas.style.height = (CH * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ════════════ AUDIO ════════════
let aud = null;
const initAudio = () => { if (!aud) aud = new (window.AudioContext || window.webkitAudioContext)(); };

function playTone(freq, type, dur, vol=0.3, freqEnd=null) {
  if (!aud) return;
  const o = aud.createOscillator(), g = aud.createGain();
  o.connect(g); g.connect(aud.destination);
  o.type = type; o.frequency.value = freq;
  if (freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, aud.currentTime + dur);
  g.gain.setValueAtTime(vol, aud.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, aud.currentTime + dur);
  o.start(); o.stop(aud.currentTime + dur);
}
function playNoise(dur, vol=0.5) {
  if (!aud) return;
  const n = aud.sampleRate * dur, buf = aud.createBuffer(1, n, aud.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = aud.createBufferSource(), g = aud.createGain();
  src.buffer = buf; src.connect(g); g.connect(aud.destination);
  g.gain.setValueAtTime(vol, aud.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, aud.currentTime + dur);
  src.start();
}
function sfx(type) {
  if (!aud) return;
  if (type==='coin')    { playTone(880,'sine',0.12,0.25,1320); }
  if (type==='crash')   { playNoise(0.35, 0.8); playTone(150,'sawtooth',0.25,0.3,80); }
  if (type==='powerup') { playTone(440,'square',0.08,0.2); playTone(660,'square',0.08,0.2); playTone(880,'square',0.12,0.2); }
  if (type==='nitro')   { playTone(200,'sawtooth',0.3,0.25,500); }
  if (type==='over')    { playTone(330,'sawtooth',0.5,0.4,110); }
  if (type==='combo')   { playTone(523,'square',0.06,0.15,660); }
  if (type==='shield')  { playTone(300,'square',0.1,0.2,600); playTone(400,'square',0.15,0.2,800); }
}

// Engine hum
let engOsc=null, engGain=null;
function startEngine() {
  if (!aud || engOsc) return;
  engOsc  = aud.createOscillator();
  engGain = aud.createGain();
  const dist = aud.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i=0;i<256;i++) curve[i] = (2*(i/255)-1);
  dist.curve = curve;
  engOsc.connect(dist); dist.connect(engGain); engGain.connect(aud.destination);
  engOsc.type = 'sawtooth'; engOsc.frequency.value = 55;
  engGain.gain.value = 0.04; engOsc.start();
}
function updateEngine(spd) {
  if (!engOsc) return;
  engOsc.frequency.linearRampToValueAtTime(55+spd*8, aud.currentTime+0.1);
  engGain.gain.linearRampToValueAtTime(Math.min(0.07, 0.03+spd*0.004), aud.currentTime+0.1);
}
function stopEngine() {
  if (engOsc) { try{engOsc.stop()}catch(e){} engOsc=null; }
}

// ════════════ CONSTANTS ════════════
const RL = 65, RR = CW-65, RW = RR-RL;
const LANES = 3, LW = RW/LANES;
const laneX = i => RL + LW*i + LW/2;

// ════════════ PARTICLES ════════════
const parts = [];
function emit(x, y, n, col, spd, life, sz, grav=0.15) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, s=spd*(0.5+Math.random()*0.5);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*0.4,
      col, life, ml:life, sz:sz*(0.6+Math.random()*0.4), grav});
  }
}
function explode(x,y) {
  emit(x,y,20,'#ff6600',7,45,5);
  emit(x,y,14,'#ffcc00',5,32,4);
  emit(x,y,8,'#ffffff',4,20,3);
  emit(x,y,6,'#ff2200',3,55,6);
  emit(x,y,10,'#884400',2,60,3,0.2);
}
function coinFX(x,y) {
  emit(x,y,10,'#FFD700',4,28,4);
  emit(x,y,6,'#FFFACD',3,18,2);
}
function updateParts() {
  for (let i=parts.length-1;i>=0;i--) {
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.vx*=0.97; p.life--;
    if (p.life<=0) parts.splice(i,1);
  }
}
function drawParts() {
  for (const p of parts) {
    const a=p.life/p.ml;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle=p.col; ctx.shadowBlur=6; ctx.shadowColor=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ════════════ SKID MARKS ════════════
const skids = [];
function addSkid(x,y) {
  if (skids.length>80) skids.shift();
  skids.push({x,y,a:0.4});
}
function drawSkids() {
  for (const s of skids) {
    ctx.fillStyle=`rgba(0,0,0,${s.a})`;
    ctx.beginPath(); ctx.ellipse(s.x,s.y,5,3,0,0,Math.PI*2); ctx.fill();
    s.a-=0.001;
  }
}

// ════════════ ROAD ════════════
let roff=0;
const DLEN=40, DGAP=30, DTOT=DLEN+DGAP;

// roadside deco
const decos=[];
function initDecos() {
  decos.length=0;
  for (let i=0;i<20;i++) {
    decos.push({y:-i*80, t:Math.floor(Math.random()*4), variant:Math.floor(Math.random()*3)});
  }
}
function updateDecos(spd) {
  for (const d of decos) {
    d.y+=spd*0.55;
    if (d.y>CH+100) { d.y-=20*80; d.t=Math.floor(Math.random()*4); d.variant=Math.floor(Math.random()*3); }
  }
}

function drawTree(x,y,side) {
  const flip = side==='L' ? 1 : -1;
  ctx.fillStyle='#3b2110'; ctx.fillRect(x-3,y-8,6,18);
  ctx.fillStyle='#1e4a10';
  ctx.beginPath(); ctx.ellipse(x,y-20,13,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2d6c1a';
  ctx.beginPath(); ctx.ellipse(x+flip*2,y-28,9,13,0,0,Math.PI*2); ctx.fill();
}
function drawLamp(x,y,side) {
  const arm = side==='L' ? 14 : -14;
  ctx.strokeStyle='#8899aa'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,y+20); ctx.lineTo(x,y-22); ctx.lineTo(x+arm,y-27); ctx.stroke();
  ctx.fillStyle='#ccddaa';
  ctx.beginPath(); ctx.arc(x+arm,y-27,5,0,Math.PI*2); ctx.fill();
  const g=ctx.createRadialGradient(x+arm,y-27,0,x+arm,y-27,30);
  g.addColorStop(0,'rgba(255,255,160,0.45)'); g.addColorStop(1,'rgba(255,255,160,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x+arm,y-27,30,0,Math.PI*2); ctx.fill();
}
function drawBuilding(x,y,side,variant) {
  const bw=32+variant*6, bh=50+variant*18;
  const bx = side==='L' ? x-bw-6 : x+6;
  ctx.fillStyle=`hsl(${220+variant*20},28%,${12+variant*4}%)`;
  ctx.fillRect(bx,y-bh,bw,bh);
  for (let wy=y-bh+6;wy<y-6;wy+=11) {
    for (let wx=bx+4;wx<bx+bw-6;wx+=9) {
      ctx.fillStyle=Math.random()>0.25?'rgba(255,255,140,0.65)':'rgba(30,30,50,0.8)';
      ctx.fillRect(wx,wy,5,6);
    }
  }
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(bx,y-bh,2,bh);
}
function drawCactus(x,y) {
  ctx.fillStyle='#2d6a2d'; ctx.fillRect(x-4,y-30,8,30);
  ctx.fillRect(x-14,y-20,10,5); ctx.fillRect(x-14,y-28,4,12);
  ctx.fillRect(x+4,y-18,10,5);  ctx.fillRect(x+10,y-26,4,10);
}
function drawDecos() {
  for (const d of decos) {
    const Lx=RL-28, Rx=RR+28;
    if (d.t===0) { drawTree(Lx,d.y,'L'); drawTree(Rx,d.y,'R'); }
    else if (d.t===1) { drawLamp(Lx,d.y,'L'); drawLamp(Rx,d.y,'R'); }
    else if (d.t===2) { drawBuilding(Lx,d.y,'L',d.variant); drawBuilding(Rx,d.y,'R',d.variant); }
    else { drawCactus(Lx,d.y); drawCactus(Rx,d.y); }
  }
}

function drawRoad(spd) {
  roff=(roff+spd)%DTOT;

  // asphalt
  const rg=ctx.createLinearGradient(RL,0,RR,0);
  rg.addColorStop(0,'#141428'); rg.addColorStop(0.5,'#1a1a38'); rg.addColorStop(1,'#141428');
  ctx.fillStyle=rg; ctx.fillRect(RL,0,RW,CH);

  // subtle road texture lines
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  for (let y=roff%20;y<CH;y+=20) {
    ctx.beginPath(); ctx.moveTo(RL,y); ctx.lineTo(RR,y); ctx.stroke();
  }

  // kerb edges
  ctx.lineWidth=5; ctx.shadowBlur=12;
  ctx.strokeStyle='#ff5500'; ctx.shadowColor='#ff5500';
  ctx.beginPath(); ctx.moveTo(RL,0); ctx.lineTo(RL,CH); ctx.stroke();
  ctx.strokeStyle='#ff5500'; ctx.shadowColor='#ff5500';
  ctx.beginPath(); ctx.moveTo(RR,0); ctx.lineTo(RR,CH); ctx.stroke();
  ctx.shadowBlur=0;

  // lane dashes
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=2; ctx.setLineDash([DLEN,DGAP]); ctx.lineDashOffset=-roff;
  for (let i=1;i<LANES;i++) {
    const lx=RL+LW*i;
    ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,CH); ctx.stroke();
  }
  ctx.setLineDash([]);
}

// ════════════ CAR RENDERER ════════════
function shade(hex,amt) {
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt));
  const g=Math.max(0,Math.min(255,((n>>8)&0xff)+amt));
  const b=Math.max(0,Math.min(255,(n&0xff)+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function drawCar(x,y,col,acc,w,h,isPlayer,shield,nitro,invBlink) {
  if (invBlink) return;
  ctx.save(); ctx.translate(x,y);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0,h/2-3,w*0.45,7,0,0,Math.PI*2); ctx.fill();

  // Nitro flames
  if (nitro && isPlayer) {
    const fx=[{x:-w/4,a:0.15},{x:w/4,a:-0.15}];
    fx.forEach(f=>{
      const fg=ctx.createLinearGradient(f.x,h/2,f.x,h/2+32);
      fg.addColorStop(0,'#ff4400'); fg.addColorStop(0.5,'#ffcc00'); fg.addColorStop(1,'rgba(255,255,0,0)');
      ctx.fillStyle=fg;
      ctx.beginPath(); ctx.ellipse(f.x,h/2+14,5+Math.random()*3,20+Math.random()*5,f.a,0,Math.PI*2); ctx.fill();
    });
  }

  // Body
  const bg=ctx.createLinearGradient(-w/2,0,w/2,0);
  bg.addColorStop(0,shade(col,-40)); bg.addColorStop(0.25,col);
  bg.addColorStop(0.75,col); bg.addColorStop(1,shade(col,-40));
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.roundRect(-w/2,-h/2+8,w,h-12,[6,6,4,4]); ctx.fill();

  // Roof cab
  const cw=w*0.65, ch2=h*0.36, cy=-h/2+8;
  ctx.fillStyle=shade(col,-28);
  ctx.beginPath(); ctx.roundRect(-cw/2,cy-ch2+6,cw,ch2,[9,9,3,3]); ctx.fill();

  // Windshields
  ctx.fillStyle='rgba(100,210,255,0.72)';
  ctx.beginPath(); ctx.roundRect(-cw/2+4,cy-ch2+9,cw-8,ch2*0.55,[6,6,2,2]); ctx.fill();
  ctx.fillStyle='rgba(90,190,240,0.55)';
  ctx.beginPath(); ctx.roundRect(-cw/2+4,cy+1,cw-8,9,[2,2,5,5]); ctx.fill();

  // Wheels
  [[‑w/2+4,‑h/2+20],[w/2-4,‑h/2+20],[‑w/2+4,h/2-12],[w/2-4,h/2-12]].forEach(([wx,wy])=>{
    ctx.fillStyle='#0d0d0d'; ctx.beginPath(); ctx.ellipse(wx,wy,8,10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a3a3a'; ctx.beginPath(); ctx.ellipse(wx,wy,5,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#777';    ctx.beginPath(); ctx.arc(wx,wy,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let a=0;a<3;a++){const ang=a*Math.PI*2/3;ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(ang)*4,wy+Math.sin(ang)*6);}
    ctx.stroke();
  });

  // Accent stripe
  ctx.fillStyle=acc; ctx.fillRect(-w/2+2,-h/2+36,w-4,3);

  // Headlights / taillights
  ctx.shadowBlur=14;
  if (isPlayer) {
    // front headlights (top, player goes up screen)
    ctx.fillStyle='#ffffbb'; ctx.shadowColor='#ffffaa';
    [[-w/2+7,-h/2+11],[w/2-7,-h/2+11]].forEach(([lx,ly])=>{ctx.beginPath();ctx.ellipse(lx,ly,5,4,0,0,Math.PI*2);ctx.fill();});
    // taillights
    ctx.fillStyle='#ff2200'; ctx.shadowColor='#ff0000';
    [[-w/2+7,h/2-7],[w/2-7,h/2-7]].forEach(([lx,ly])=>{ctx.beginPath();ctx.ellipse(lx,ly,5,4,0,0,Math.PI*2);ctx.fill();});
  } else {
    ctx.fillStyle='#ff2200'; ctx.shadowColor='#ff0000';
    [[-w/2+7,h/2-7],[w/2-7,h/2-7]].forEach(([lx,ly])=>{ctx.beginPath();ctx.ellipse(lx,ly,5,4,0,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#ffffbb'; ctx.shadowColor='#ffffaa';
    [[-w/2+7,-h/2+11],[w/2-7,-h/2+11]].forEach(([lx,ly])=>{ctx.beginPath();ctx.ellipse(lx,ly,4,3,0,0,Math.PI*2);ctx.fill();});
  }
  ctx.shadowBlur=0;

  // Shield bubble
  if (shield) {
    const sg=ctx.createRadialGradient(0,0,w*0.25,0,0,w*0.8);
    sg.addColorStop(0,'rgba(0,160,255,0)');
    sg.addColorStop(0.7,'rgba(0,160,255,0.12)');
    sg.addColorStop(1,'rgba(0,220,255,0.65)');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.ellipse(0,0,w*0.75,h*0.68,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,220,255,0.85)'; ctx.lineWidth=2;
    ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.ellipse(0,0,w*0.75,h*0.68,0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

// ════════════ COIN ════════════
function drawCoin(x,y,f) {
  const pulse=Math.sin(f*0.1)*2;
  ctx.save(); ctx.translate(x,y);
  ctx.shadowBlur=14+pulse; ctx.shadowColor='#FFD700';
  const cg=ctx.createRadialGradient(-3,-3,1,0,0,10);
  cg.addColorStop(0,'#FFFDE7'); cg.addColorStop(0.4,'#FFD700'); cg.addColorStop(1,'#B8860B');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff8'; ctx.font='bold 9px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('$',0,1);
  ctx.shadowBlur=0; ctx.restore();
}

// ════════════ POWER-UPS ════════════
const PU={
  shield:     {col:'#00aaff', icon:'🛡',  lab:'SHIELD',   dur:350},
  nitro_fill: {col:'#ff6600', icon:'🔥',  lab:'NITRO FULL',dur:0},
  extra_life: {col:'#ff0055', icon:'❤',   lab:'+1 LIFE',   dur:0},
  slow:       {col:'#aa00ff', icon:'⏱',   lab:'SLOW TIME', dur:200},
  magnet:     {col:'#ffdd00', icon:'🧲',  lab:'MAGNET',    dur:260},
  x2:         {col:'#00ff88', icon:'×2',  lab:'SCORE ×2',  dur:320},
};

function drawPU(x,y,type,f) {
  const info=PU[type];
  const p=Math.sin(f*0.07)*3;
  ctx.save(); ctx.translate(x,y);
  ctx.shadowBlur=18+p; ctx.shadowColor=info.col;
  ctx.fillStyle=info.col+'33'; ctx.strokeStyle=info.col; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(-17,-17,34,34,8); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  // rotating ring
  ctx.save(); ctx.rotate(f*0.04);
  ctx.strokeStyle=info.col+'88'; ctx.lineWidth=1.5;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(info.icon,0,1);
  ctx.restore();
}

// ════════════ GAME STATE ════════════
let STATE='menu';  // menu | playing | paused | gameover
let score=0, hiScore=+(localStorage.getItem('TR_HS')||0);
let coins=0, lives=3, frame=0, spd=4, dist=0, mult=1, combo=0;
let flashMsg='', flashT=0;
const popups=[];

const P={
  lane:1, x:laneX(1), tx:laneX(1), y:CH-135,
  w:36, h:70, col:'#ff2200', acc:'#ff9900',
  shield:0, nitro:100, maxNitro:100, nitroOn:false,
  inv:0, x2:0, magnet:0, slowT:0
};

const traffic=[], coinList=[], puList=[];
const TCOLS=[
  ['#0044ff','#00aaff'],['#009900','#00ff55'],['#990099','#ff00ff'],
  ['#888800','#ffff00'],['#009999','#00ffff'],['#cc4400','#ff8800'],
  ['#cccccc','#ffffff'],['#442299','#8844ff'],['#006633','#00ff88'],
];

function spawnTraffic() {
  const lane=Math.floor(Math.random()*LANES);
  for (const c of traffic) if(c.lane===lane && c.y>-90) return;
  const [col,acc]=TCOLS[Math.floor(Math.random()*TCOLS.length)];
  const cspd=spd*(0.25+Math.random()*0.45);
  traffic.push({lane,x:laneX(lane),y:-90,w:30+Math.random()*10,h:60+Math.random()*22,col,acc,spd:cspd,scored:false});
}
function spawnCoin() {
  const lane=Math.floor(Math.random()*LANES);
  coinList.push({lane,x:laneX(lane),y:-20});
}
function spawnPU() {
  const lane=Math.floor(Math.random()*LANES);
  const type=Object.keys(PU)[Math.floor(Math.random()*Object.keys(PU).length)];
  puList.push({lane,x:laneX(lane),y:-35,type});
}

// ════════════ INPUT ════════════
const keys={};
const moveL=()=>{ if(P.lane>0){P.lane--;P.tx=laneX(P.lane);} };
const moveR=()=>{ if(P.lane<LANES-1){P.lane++;P.tx=laneX(P.lane);} };
const doNitro=()=>{ if(P.nitro>5){P.nitroOn=true;sfx('nitro');} };

window.addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(STATE==='playing'){
    if(e.code==='ArrowLeft'||e.code==='KeyA') moveL();
    if(e.code==='ArrowRight'||e.code==='KeyD') moveR();
    if(e.code==='Space'||e.code==='ShiftLeft') { e.preventDefault(); doNitro(); }
    if(e.code==='KeyP'||e.code==='Escape') togglePause();
  } else if(STATE==='menu'||STATE==='gameover') {
    if(e.code==='Space'||e.code==='Enter') startGame();
  }
});
window.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='Space'||e.code==='ShiftLeft') P.nitroOn=false;
});

document.getElementById('leftBtn').addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(STATE==='playing')moveL();},{passive:false});
document.getElementById('rightBtn').addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(STATE==='playing')moveR();},{passive:false});
document.getElementById('nitroBtn').addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(STATE==='playing')doNitro();},{passive:false});
document.getElementById('nitroBtn').addEventListener('touchend',e=>{e.preventDefault();P.nitroOn=false;},{passive:false});

let tsX=0,tsY=0;
canvas.addEventListener('touchstart',e=>{initAudio();tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;if(STATE!=='playing')startGame();},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
  if(STATE==='playing'&&Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){dx<0?moveL():moveR();}
  if(STATE==='playing'&&Math.abs(dx)<15&&Math.abs(dy)<15) togglePause();
},{passive:true});
canvas.addEventListener('click',e=>{initAudio();if(STATE==='menu'||STATE==='gameover')startGame();else if(STATE==='playing')togglePause();});

// ════════════ GAME FUNCTIONS ════════════
function startGame() {
  initAudio(); STATE='playing';
  score=coins=frame=dist=combo=0; lives=3; spd=4; mult=1;
  P.lane=1; P.x=P.tx=laneX(1); P.shield=P.inv=P.x2=P.magnet=P.slowT=0;
  P.nitro=P.maxNitro; P.nitroOn=false;
  traffic.length=coinList.length=puList.length=parts.length=skids.length=popups.length=0;
  initDecos(); startEngine();
}
function togglePause() {
  if(STATE==='playing') STATE='paused';
  else if(STATE==='paused') STATE='playing';
}
function endGame() {
  STATE='gameover';
  if(score>hiScore){hiScore=score;localStorage.setItem('TR_HS',hiScore);}
  stopEngine(); sfx('over'); explode(P.x,P.y);
}
function col2(a,b,margin=12) {
  return Math.abs(a.x-b.x)<(a.w/2+b.w/2-margin)&&Math.abs(a.y-b.y)<(a.h/2+b.h/2-margin);
}
function activatePU(type) {
  const info=PU[type];
  if(type==='shield')     { P.shield=info.dur; sfx('shield'); }
  else if(type==='nitro_fill') { P.nitro=P.maxNitro; P.nitroOn=true; sfx('nitro'); }
  else if(type==='extra_life') { lives=Math.min(5,lives+1); }
  else if(type==='slow')  { P.slowT=info.dur; }
  else if(type==='magnet'){ P.magnet=info.dur; }
  else if(type==='x2')    { P.x2=info.dur; }
  flashMsg=info.lab; flashT=100; sfx('powerup');
}
function popup(x,y,txt,col) {
  popups.push({x,y,txt,col,life:55,ml:55});
}

// ════════════ UPDATE ════════════
function update() {
  if(STATE!=='playing') return;
  frame++;

  // speed & distance
  spd=4+dist/2200;
  let actualSpd=spd;
  if(P.nitroOn&&P.nitro>0){
    actualSpd+=4.5; P.nitro-=1.8;
    emit(P.x,P.y+36,2,'#ff6600',3,12,2.5,0);
    if(P.nitro<=0){P.nitro=0;P.nitroOn=false;}
  } else {
    P.nitro=Math.min(P.maxNitro,P.nitro+0.35);
  }
  updateEngine(actualSpd);
  dist+=actualSpd;
  score+=Math.floor(actualSpd*mult*0.12);

  // player X lerp
  P.x+=(P.tx-P.x)*0.22;

  // timers
  if(P.shield>0) P.shield--;
  if(P.inv>0) P.inv--;
  if(P.x2>0){P.x2--;mult=2;}else mult=1;
  if(P.magnet>0) P.magnet--;
  if(P.slowT>0) P.slowT--;

  const tmod=P.slowT>0?0.38:1;

  // spawn
  const sr=Math.max(38,88-dist/600);
  if(frame%Math.floor(sr)===0) spawnTraffic();
  if(frame%58===0) spawnCoin();
  if(frame%280===0) spawnPU();

  // traffic
  for(let i=traffic.length-1;i>=0;i--) {
    const c=traffic[i];
    c.y+=(c.spd*tmod)+actualSpd*0.82;
    c.x+=(laneX(c.lane)-c.x)*0.12;
    if(!c.scored&&c.y>P.y+60){
      c.scored=true; combo++; const pts=15*combo*mult;
      score+=pts; popup(P.x,P.y-50,'+'+pts,combo>4?'#ff0':'#fff');
      if(combo>=3) sfx('combo');
    }
    if(P.inv===0&&col2(P,c)){
      if(P.shield>0){
        P.shield=0; P.inv=110; explode(c.x,c.y); sfx('crash');
        traffic.splice(i,1); combo=0; continue;
      } else {
        lives--; P.inv=160; combo=0; explode(c.x,c.y); sfx('crash');
        addSkid(c.x,c.y); traffic.splice(i,1);
        if(lives<=0){endGame();return;} continue;
      }
    }
    if(c.y>CH+110) traffic.splice(i,1);
  }

  // coins
  for(let i=coinList.length-1;i>=0;i--) {
    const c=coinList[i];
    c.y+=actualSpd*0.82; c.x+=(laneX(c.lane)-c.x)*0.12;
    if(P.magnet>0){const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);if(d<160){c.x+=dx*0.14;c.y+=dy*0.14;}}
    if(Math.abs(c.x-P.x)<22&&Math.abs(c.y-P.y)<32){
      coins++; score+=55*mult; coinFX(c.x,c.y); sfx('coin');
      popup(c.x,c.y-15,'+55','#FFD700'); coinList.splice(i,1); continue;
    }
    if(c.y>CH+20) coinList.splice(i,1);
  }

  // powerups
  for(let i=puList.length-1;i>=0;i--) {
    const p=puList[i];
    p.y+=actualSpd*0.82; p.x+=(laneX(p.lane)-p.x)*0.12;
    if(Math.abs(p.x-P.x)<30&&Math.abs(p.y-P.y)<38){activatePU(p.type);puList.splice(i,1);continue;}
    if(p.y>CH+40) puList.splice(i,1);
  }

  updateDecos(actualSpd);
  updateParts();

  // popups
  for(let i=popups.length-1;i>=0;i--){popups[i].y-=1;popups[i].life--;if(popups[i].life<=0)popups.splice(i,1);}
}

// ════════════ HUD ════════════
function drawHUD() {
  // top bar
  const hbg=ctx.createLinearGradient(0,0,0,58);
  hbg.addColorStop(0,'rgba(0,0,0,0.82)'); hbg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hbg; ctx.fillRect(0,0,CW,58);

  // score
  ctx.textAlign='left'; ctx.fillStyle='#aaa'; ctx.font='bold 10px monospace';
  ctx.fillText('SCORE',8,16);
  ctx.fillStyle='#ffff00'; ctx.font='bold 19px monospace';
  ctx.fillText(String(score).padStart(7,'0'),8,37);

  // best
  ctx.textAlign='center'; ctx.fillStyle='#666'; ctx.font='bold 10px monospace';
  ctx.fillText('BEST',CW/2,15);
  ctx.fillStyle='#ff9900'; ctx.font='bold 14px monospace';
  ctx.fillText(String(hiScore).padStart(7,'0'),CW/2,30);

  // coins
  ctx.fillStyle='#FFD700'; ctx.font='bold 12px monospace';
  ctx.fillText('🪙 '+coins,CW/2,47);

  // lives
  ctx.textAlign='right'; ctx.font='15px serif';
  ctx.fillText('❤️'.repeat(lives),CW-8,28);

  // speed
  ctx.fillStyle='#668899'; ctx.font='bold 10px monospace'; ctx.textAlign='right';
  ctx.fillText(Math.floor(spd*30)+' km/h',CW-8,47);

  // distance
  ctx.textAlign='left'; ctx.fillStyle='#445566'; ctx.font='9px monospace';
  ctx.fillText(Math.floor(dist/100)+'m',10,50);

  // Nitro bar
  const nBW=120,nBH=12,nX=CW/2-nBW/2,nY=CH-22;
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.roundRect(nX-2,nY-2,nBW+4,nBH+4,4); ctx.fill();
  const nFrac=P.nitro/P.maxNitro;
  if(nFrac>0){
    const ng=ctx.createLinearGradient(nX,0,nX+nBW,0);
    ng.addColorStop(0,'#ff2200'); ng.addColorStop(0.5,'#ff8800'); ng.addColorStop(1,'#ffdd00');
    ctx.fillStyle=ng;
    ctx.beginPath(); ctx.roundRect(nX,nY,nBW*nFrac,nBH,3); ctx.fill();
    if(P.nitroOn){ctx.shadowBlur=10;ctx.shadowColor='#ff6600';}
  }
  ctx.strokeStyle=P.nitroOn?'#ff8800':'#664400'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(nX,nY,nBW,nBH,3); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff8800'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
  ctx.fillText('🔥 NITRO',CW/2,nY-3);

  // Active powerup icons
  let px=8;
  const showPU=(icon,col,frac)=>{
    ctx.save(); ctx.translate(px,CH-58);
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(0,0,34,34,6); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(17,17,13,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
    ctx.font='15px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(icon,17,18);
    ctx.restore(); px+=38;
  };
  if(P.shield>0)  showPU('🛡','#00aaff',P.shield/350);
  if(P.x2>0)      showPU('×2','#00ff88',P.x2/320);
  if(P.magnet>0)  showPU('🧲','#ffdd00',P.magnet/260);
  if(P.slowT>0)   showPU('⏱','#aa00ff',P.slowT/200);

  // Combo
  if(combo>1){
    ctx.save(); ctx.textAlign='right';
    ctx.fillStyle=`hsl(${frame*4%360},100%,65%)`;
    ctx.font=`bold ${Math.min(18,13+combo)}px monospace`;
    ctx.shadowBlur=10; ctx.shadowColor='#ffffff';
    ctx.fillText(`×${combo} COMBO!`,CW-8,CH-38);
    ctx.shadowBlur=0; ctx.restore();
  }

  // Score×2 banner
  if(P.x2>0&&(frame%20)<10){
    ctx.save(); ctx.textAlign='center'; ctx.globalAlpha=0.9;
    ctx.fillStyle='#00ff88'; ctx.font='bold 13px monospace';
    ctx.fillText('SCORE ×2',CW/2,CH-42); ctx.restore();
  }

  // Flash message
  if(flashT>0){
    const a=Math.min(1,flashT/30);
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.font='bold 28px monospace'; ctx.shadowBlur=22; ctx.shadowColor='#ffff44';
    ctx.fillStyle='#ffff00';
    ctx.fillText(flashMsg+'!',CW/2,CH/2-80);
    ctx.shadowBlur=0; ctx.restore(); flashT--;
  }

  // Popups
  for(const pp of popups){
    const a=pp.life/pp.ml;
    ctx.save(); ctx.globalAlpha=a*0.9; ctx.textAlign='center';
    ctx.fillStyle=pp.col; ctx.font=`bold 14px monospace`;
    ctx.fillText(pp.txt,pp.x,pp.y); ctx.restore();
  }

  // Slow traffic overlay
  if(P.slowT>0){ctx.fillStyle='rgba(80,0,180,0.07)';ctx.fillRect(0,0,CW,CH);}
  // Invincibility red flash
  if(P.inv>0&&P.inv%10<5){ctx.fillStyle='rgba(255,0,0,0.12)';ctx.fillRect(0,0,CW,CH);}
  // Nitro speed lines
  if(P.nitroOn){
    ctx.save(); ctx.globalAlpha=0.15; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    for(let i=0;i<8;i++){
      const lx=RL+20+Math.random()*RW;
      ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx+Math.random()*10-5,CH); ctx.stroke();
    }
    ctx.restore();
  }
}

// ════════════ SCREENS ════════════
function stars() {
  for(let i=0;i<65;i++){
    const sx=(i*137.5+frame*0.25)%CW, sy=(i*97.3+frame*0.18)%CH;
    const sa=Math.sin(frame*0.045+i)*0.45+0.55;
    ctx.fillStyle=`rgba(255,255,255,${sa*0.7})`; ctx.fillRect(sx,sy,1.5,1.5);
  }
}

function drawMenu() {
  ctx.fillStyle='#060616'; ctx.fillRect(0,0,CW,CH);
  stars();
  // fake road
  ctx.fillStyle='#12122a'; ctx.fillRect(RL,0,RW,CH);
  ctx.strokeStyle='rgba(255,80,0,0.4)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(RL,0); ctx.lineTo(RL,CH); ctx.moveTo(RR,0); ctx.lineTo(RR,CH); ctx.stroke();

  // Title
  ctx.textAlign='center';
  ctx.font='bold 58px monospace'; ctx.shadowBlur=35; ctx.shadowColor='#ff2200';
  ctx.fillStyle='#ff2200'; ctx.fillText('TURBO',CW/2,215);
  ctx.shadowColor='#ff9900'; ctx.fillStyle='#ff9900';
  ctx.fillText('RUSH',CW/2,268); ctx.shadowBlur=0;
  ctx.fillStyle='#555'; ctx.font='12px monospace'; ctx.fillText('ULTIMATE CAR RACING',CW/2,292);

  // emoji car
  ctx.font='38px serif'; ctx.fillText('🏎️',CW/2,170);

  // Features grid
  const feats=['🛡 SHIELD','🔥 NITRO BOOST','🧲 COIN MAGNET','⏱ SLOW TIME','×2 SCORE MULTI','❤ EXTRA LIFE'];
  ctx.font='12px monospace'; ctx.textAlign='left';
  feats.forEach((f,i)=>{
    const a=0.55+Math.sin(frame*0.04+i*0.8)*0.4;
    ctx.fillStyle=`rgba(170,170,170,${a})`;
    ctx.fillText(f, i%2===0?CW/2-100:CW/2+4, 325+Math.floor(i/2)*24);
  });

  if(hiScore>0){
    ctx.textAlign='center'; ctx.fillStyle='#cc7700'; ctx.font='bold 13px monospace';
    ctx.fillText('🏆 BEST: '+hiScore,CW/2,CH-108);
  }

  // Play button
  const bp=Math.sin(frame*0.07)*5;
  ctx.save(); ctx.shadowBlur=18+bp; ctx.shadowColor='#ff3300';
  const bg2=ctx.createLinearGradient(CW/2-90,0,CW/2+90,0);
  bg2.addColorStop(0,'#aa1100'); bg2.addColorStop(0.5,'#ff3300'); bg2.addColorStop(1,'#aa1100');
  ctx.fillStyle=bg2; ctx.beginPath(); ctx.roundRect(CW/2-90,CH-95,180,52,26); ctx.fill();
  ctx.strokeStyle='#ff8866'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='bold 20px monospace'; ctx.textAlign='center';
  ctx.fillText('▶  PLAY',CW/2,CH-64); ctx.restore();

  ctx.fillStyle='#444'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText('← → move  |  SPACE nitro  |  swipe on mobile',CW/2,CH-16);

  frame++; updateParts(); drawParts();
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';
  ctx.font='bold 48px monospace'; ctx.shadowBlur=28; ctx.shadowColor='#ff0000';
  ctx.fillStyle='#ff0000'; ctx.fillText('GAME',CW/2,CH/2-120);
  ctx.fillText('OVER',CW/2,CH/2-68); ctx.shadowBlur=0;

  ctx.fillStyle='#fff'; ctx.font='bold 15px monospace';
  ctx.fillText('SCORE: '+score,CW/2,CH/2-16);
  ctx.fillStyle='#FFD700'; ctx.fillText('🪙 COINS: '+coins,CW/2,CH/2+14);
  ctx.fillStyle='#88aacc'; ctx.font='12px monospace';
  ctx.fillText('DISTANCE: '+Math.floor(dist/100)+'m',CW/2,CH/2+40);

  const newHS=score>=hiScore&&score>0;
  ctx.fillStyle=newHS?'#ffaa00':'#777'; ctx.font=`bold ${newHS?16:13}px monospace`;
  ctx.fillText((newHS?'🏆 NEW RECORD: ':'BEST: ')+hiScore,CW/2,CH/2+70);

  // play again
  const bp=Math.sin(frame*0.07)*4;
  ctx.save(); ctx.shadowBlur=14+bp; ctx.shadowColor='#00cc44';
  const bg2=ctx.createLinearGradient(CW/2-90,0,CW/2+90,0);
  bg2.addColorStop(0,'#005522'); bg2.addColorStop(0.5,'#00cc44'); bg2.addColorStop(1,'#005522');
  ctx.fillStyle=bg2; ctx.beginPath(); ctx.roundRect(CW/2-90,CH/2+98,180,52,26); ctx.fill();
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='bold 17px monospace'; ctx.textAlign='center';
  ctx.fillText('▶  PLAY AGAIN',CW/2,CH/2+128); ctx.restore();

  ctx.fillStyle='#444'; ctx.font='11px monospace';
  ctx.fillText('TAP or PRESS ENTER',CW/2,CH/2+170);

  frame++; updateParts(); drawParts();
}

function drawPaused() {
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center'; ctx.shadowBlur=22; ctx.shadowColor='#ffffff';
  ctx.fillStyle='#fff'; ctx.font='bold 42px monospace';
  ctx.fillText('PAUSED',CW/2,CH/2); ctx.shadowBlur=0;
  ctx.fillStyle='#888'; ctx.font='13px monospace';
  ctx.fillText('tap or press P to resume',CW/2,CH/2+42);
}

// ════════════ BG ════════════
function drawBG() {
  const sky=ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#020210'); sky.addColorStop(1,'#080820');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH);
  // stars
  for(let i=0;i<45;i++){
    const sx=(i*137.5)%CW, sy=(i*97.3)%(CH*0.55);
    const sa=Math.sin(frame*0.025+i)*0.3+0.7;
    ctx.fillStyle=`rgba(255,255,255,${sa*0.55})`; ctx.fillRect(sx,sy,1.5,1.5);
  }
  drawDecos();
  drawRoad(spd+(P.nitroOn?4.5:0));
}

// ════════════ MAIN LOOP ════════════
function draw() {
  ctx.clearRect(0,0,CW,CH);
  if(STATE==='menu')     { drawMenu(); return; }
  if(STATE==='gameover') { drawGameOver(); return; }

  drawBG();
  drawSkids();
  coinList.forEach(c=>drawCoin(c.x,c.y,frame));
  puList.forEach(p=>drawPU(p.x,p.y,p.type,frame));
  traffic.forEach(c=>drawCar(c.x,c.y,c.col,c.acc,c.w,c.h,false,false,false,false));

  // Player (blink when invincible)
  const blink=P.inv>0&&P.inv%8<4;
  // speed trails
  if(spd+(P.nitroOn?4.5:0)>7){
    for(let t=1;t<=3;t++){
      ctx.save(); ctx.globalAlpha=0.12/t;
      drawCar(P.x,P.y+t*13,P.col,P.acc,P.w,P.h,true,false,false,false);
      ctx.restore();
    }
  }
  drawCar(P.x,P.y,P.col,P.acc,P.w,P.h,true,P.shield>0,P.nitroOn,blink);

  drawParts();
  drawHUD();
  if(STATE==='paused') drawPaused();
}

function loop() {
  update(); draw(); frame++;
  requestAnimationFrame(loop);
}

initDecos();
loop();

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
